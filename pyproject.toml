[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ach-nacha-toolkit"
version = "0.1.0"
description = "US Automated Clearing House (NACHA) 94-char fixed-width file generator, parser, validator, and returns handler"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "Apache-2.0" }
authors = [
    { name = "aipd506" }
]
keywords = ["nacha", "ach", "banking", "payments", "fedwire", "settlement", "fintech"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Financial and Insurance Industry",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Office/Business :: Financial :: Accounting",
]
dependencies = []

[project.scripts]
nachatool = "ach_nacha_toolkit.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["ach_nacha_toolkit*"]
